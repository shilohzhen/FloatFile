name: FloatFile
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"

targets:
  FloatFile:
    type: application
    platform: macOS
    sources:
      - Sources/FloatFile
    info:
      path: Sources/FloatFile/Resources/Info.plist
      properties:
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.FloatFile
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
